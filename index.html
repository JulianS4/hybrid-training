<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Hybrid Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool, used mid-workout with sweaty thumbs: big targets, few words
   IDEA a gym logbook page per day, colour-coded with Julian's own Notion muscle colours
   PICTURE the day itself: a large progress ring + set rows grouped into A/B/C blocks
   COLOUR white / near-black ground, signal red for done + progress, Notion category colours as tags
   TYPE Archivo wide 800 for titles and numbers, Archivo for text
   LAYOUT one column up to 720px: week strip, day header with ring, blocks, sticky rest-timer bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e0e0f);--ink:light-dark(#111111,#f1f1f1);--mut:light-dark(#62626a,#a2a2aa);--line:light-dark(#e3e3e6,#29292d);--card:light-dark(#f5f5f6,#18181a);--acc:#e4002b;--acc2:light-dark(#fde3e8,#3a0c16);--k-push:#d9363e;--k-pull:#2f6fdb;--k-sch:#e07b1f;--k-quad:#7d4fd6;--k-hk:#9a6440;--k-ws:#d6488f;--k-core:#73737d;--k-ath:#1f9d55;--k-prep:#c29a12}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:max(16px,env(safe-area-inset-top))}
.brand{font-weight:800;font-stretch:112%;font-size:20px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.tabs a{padding:8px 14px;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:600;font-size:15px}
.tabs a.on{background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--mut);margin:6px 0 0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 0 8px}
.week a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:12px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid transparent;position:relative}
.week a b{font-size:15px}.week a span{font-size:13px;color:var(--mut)}
.week a.sel{border-color:var(--ink)}
.week a.today span{color:var(--acc);font-weight:700}
.week a.done::after{content:"";position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 0 14px;border-bottom:3px solid var(--ink)}
.hero .k{font-size:14px;color:var(--mut);margin:0}
.hero h1{font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:800;font-stretch:112%;margin:2px 0 6px;text-wrap:balance}
.hero .m{margin:0;color:var(--mut);font-size:15px}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .n b{font-size:28px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.ring .n span{font-size:13px;color:var(--mut);margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{color:var(--acc)}
.btn:focus-visible,.chk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs a:focus-visible,.week a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
section.blk{margin-top:22px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.bh h2{font-size:22px;font-weight:800;font-stretch:112%;margin:0;letter-spacing:-.01em}
.bh p{margin:0;font-size:14px;color:var(--mut);text-align:right}
.ex{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.exh{display:flex;align-items:center;gap:10px}
.tag{flex:none;background:var(--c);color:#fff;font:800 13px Archivo,sans-serif;font-stretch:112%;border-radius:8px;padding:4px 7px;min-width:34px;text-align:center}
.exh h3{font-size:18px;margin:0;line-height:1.2;flex:1}
.ed{border:0;background:none;color:var(--mut);font:600 14px Archivo,sans-serif;min-height:44px;padding:0 4px;cursor:pointer}
.tgt{margin:6px 0 0;font-weight:600;font-size:15px}
.tgt i{font-style:normal;color:var(--mut);font-weight:400}
.note{margin:2px 0 0;font-size:14px;color:var(--mut)}
.last{margin:8px 0 0;font-size:14px}
.last b{font-variant-numeric:tabular-nums}
.up{display:inline-block;margin:6px 0 0;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:8px;padding:3px 8px}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.set .no{font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.set label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:46px;font-size:14px;color:var(--mut)}
.set input{width:100%;border:0;background:none;color:var(--ink);font:700 18px Archivo,sans-serif;font-variant-numeric:tabular-nums;padding:0;outline:0}
.set input::placeholder{color:var(--mut);opacity:.55;font-weight:500}
.set .sp{grid-column:span 1}
.chk{width:52px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--mut);font:800 20px Archivo,sans-serif;cursor:pointer}
.set.ok .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.set.ok label{border-color:transparent}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px}
.list li+li{border-top:1px solid var(--line)}
.list label{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;cursor:pointer}
.list input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.list .s{margin-left:auto;color:var(--mut);font-size:14px;white-space:nowrap}
.add{width:100%;border:2px dashed var(--line);background:none;color:var(--mut);font:600 15px Archivo,sans-serif;min-height:48px;border-radius:14px;cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.scale button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:800 17px Archivo,sans-serif;cursor:pointer}
.scale button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,sans-serif;padding:10px 12px}
.grid{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;font-size:13px}
.grid .h{color:var(--mut);text-align:center}.grid .w{color:var(--mut);white-space:nowrap;align-self:center}
.grid .c{aspect-ratio:1;border-radius:6px;background:var(--card)}
.grid .c.f1{background:color-mix(in srgb,var(--acc) 40%,var(--card))}
.grid .c.f2{background:var(--acc)}
.grid .c.t{outline:2px solid var(--ink);outline-offset:-2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px;margin-top:16px}
.stats div{background:var(--card);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-size:30px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:14px;color:var(--mut)}
details.ses{background:var(--card);border-radius:14px;margin-top:8px}
details.ses summary{padding:14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.ses summary::-webkit-details-marker{display:none}
details.ses summary b{flex:1}details.ses summary span{color:var(--mut);font-size:14px;white-space:nowrap}
details.ses ul{margin:0;padding:0 14px 14px;list-style:none;font-size:15px}
details.ses li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px solid var(--line)}
details.ses li span{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);margin-top:12px}
.health{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px;padding:14px;border-radius:16px;background:var(--acc2)}
.health p{margin:0;flex:1 1 220px;font-size:15px}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
.steps code,.kv code{background:var(--card);border-radius:6px;padding:1px 6px;font-size:14px;overflow-wrap:anywhere}
.prose p{margin:8px 0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:none}
#bar.on{display:block}
#bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
#bar .t{font-size:34px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;flex:1;line-height:1}
#bar .t small{display:block;font-size:13px;font-weight:500;font-stretch:100%;opacity:.7;margin-bottom:2px}
#bar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
#bar.end{background:var(--acc)}
.sheet{position:fixed;inset:0;z-index:10;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet form{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:22px;font-weight:800;font-stretch:112%}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
.fg input,.fg select{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Archivo,sans-serif;padding:0 10px}
.fa{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.fa .sp{flex:1}
/* progress & records */
.exl{color:inherit;text-decoration:none;display:inline-block;padding:11px 0;margin:-11px 0}
.exl::after{content:"›";margin-left:6px;color:var(--mut);font-weight:600}
.set.pr .no{color:var(--acc);font-size:12px;font-weight:800}
.up+.up{margin-left:6px}
.up.pr{background:var(--acc);color:#fff}
.back{border:0;background:none;color:var(--mut);font:600 15px Archivo,sans-serif;min-height:44px;padding:0;margin-top:6px;cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-top:16px}
.seg button{border:0;background:none;color:var(--mut);font:600 15px Archivo,sans-serif;min-height:40px;padding:0 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--ink)}
.chart{position:relative;background:var(--card);border-radius:16px;padding:14px 14px 8px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:12px Archivo,sans-serif;fill:var(--mut);font-variant-numeric:tabular-nums}
.chart text.v{font-weight:700;font-size:14px;fill:var(--ink)}
.chart .tip{position:absolute;top:10px;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.4;white-space:nowrap;box-shadow:0 6px 18px rgb(0 0 0/.14);display:none}
.chart .tip b{display:block;font-size:17px;font-weight:800;font-stretch:112%}
.chart .tip span{display:block;color:var(--mut)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 2px 0;font-size:13px;color:var(--mut)}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.key .f{background:var(--acc)}.key .h{border:2px solid var(--acc)}
.rows{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px}
.rows li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px}
.rows li+li{border-top:1px solid var(--line)}
.rows li.ln{padding:0}
.rows a{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;flex:1;color:inherit;text-decoration:none}
.rows .nm{flex:1;display:flex;flex-direction:column;line-height:1.3}
.rows .nm small{color:var(--mut);font-size:14px}
.rows .val{color:var(--mut);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.rows .chev{color:var(--mut);font-size:22px;line-height:1}
.chip{flex:none;background:var(--acc);color:#fff;font:800 11px Archivo,sans-serif;letter-spacing:.03em;border-radius:6px;padding:3px 6px}
.spark{flex:none}
.move{margin-top:12px;padding:14px;border-radius:16px;background:var(--acc2)}
.move p{margin:0;font-size:15px}
.move b{color:var(--acc)}
.dsel{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--mut);font-size:14px}
.dsel select{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--ink);font:600 16px Archivo,sans-serif;min-height:42px;padding:0 34px 0 0;cursor:pointer}
.dsel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);pointer-events:none}
.ring .n b.sm{font-size:21px}
.dsel.past{background:var(--acc2);border-color:transparent}
.dsel.past select{color:var(--acc)}.dsel.past::after{border-color:var(--acc)}
.dsel:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.s2 b,.stats.s3 b{font-size:28px}.stats b small{font-size:15px;font-weight:700;font-stretch:100%}
.morebtn{margin-top:8px;width:100%}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));z-index:20;transform:translate(-50%,-160%);width:max-content;max-width:calc(100% - 32px);background:var(--acc);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.35;box-shadow:0 10px 28px rgb(0 0 0/.28)}
#toast b{display:block;font-size:18px;font-weight:800;font-stretch:112%}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .5s ease}#toast{transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}}
@media(max-width:420px){.set{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px}.chk{width:48px}.hero{grid-template-columns:minmax(0,1fr) 88px}.ring{width:88px;height:88px}.grid{grid-template-columns:54px repeat(7,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Hybrid Training</div>
    <nav class="tabs"><a href="#" id="tWeek">Woche</a><a href="#verlauf" id="tHist">Verlauf</a><a href="#mehr" id="tMore">Mehr</a></nav>
  </header>
  <p class="status" id="status">Lädt…</p>
  <div class="move" role="note"><p><b>Diese App zieht um nach KI-Apps.</b> 1. Backup speichern · 2. In KI-Apps unter Einstellungen laden.</p><div class="tools"><button class="btn pri" id="mvExport" type="button">Backup speichern</button><a class="btn" href="https://julians4.github.io/ki-apps/" style="display:inline-flex;align-items:center;text-decoration:none">KI-Apps öffnen</a></div></div>
  <main id="main"></main>
</div>
<div id="bar"><div class="in"><div class="t" id="barT"><small>Pause</small>0:00</div><button class="btn" id="bPlus" type="button">+15 s</button><button class="btn" id="bSkip" type="button">Weiter</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet"><form id="form" autocomplete="off">
  <h2 id="fTitle">Übung</h2>
  <div class="fg">
    <label class="full">Name<input id="fName" required></label>
    <label>Kategorie<select id="fCat"></select></label>
    <label>Einheit<select id="fUnit"><option value="reps">Wiederholungen</option><option value="sec">Sekunden</option><option value="min">Minuten</option><option value="check">Nur abhaken</option></select></label>
    <label>Sätze<input id="fSets" type="number" inputmode="numeric" min="1" max="10"></label>
    <label>Gewicht/Strecke<select id="fLoad"><option value="">Keins</option><option value="kg">kg (Weste/Hantel)</option><option value="km">km</option></select></label>
    <label>Ziel von<input id="fMin" type="number" inputmode="numeric" min="0"></label>
    <label>Ziel bis<input id="fMax" type="number" inputmode="numeric" min="0"></label>
    <label>Pro Seite?<select id="fPer"><option value="">Nein</option><option value="/Seite">Ja, pro Seite</option></select></label>
    <label>Pause (s)<input id="fRest" type="number" inputmode="numeric" min="0" placeholder="vom Block"></label>
    <label class="full">Equipment<input id="fEq"></label>
    <label class="full">Hinweis<input id="fNote"></label>
  </div>
  <div class="fa"><button class="btn red" type="button" id="fDel">Löschen</button><span class="sp"></span><button class="btn" type="button" id="fCancel">Abbrechen</button><button class="btn pri" type="submit">Speichern</button></div>
</form></div>
<script>
{
const CATS={push:'Push',pull:'Pull',sch:'Schultern',quad:'Quads',hk:'Hintere Kette',ws:'Unterschenkel',core:'Core',ath:'Athletik',prep:'Prep'};
const WU_L=['Knee-to-Wall Ankle Rocks · 45 s/Seite','World’s Greatest Stretch · 45 s/Seite','ATG Split Squat · 30 s/Seite','Leg Swings · 30 s/Seite','Dynamic Deep Squats · 60 s','Single-Leg Glute Bridges · 10×/Seite'];
const WU_U=['Band Dislocates · 15×','Scapula Pull-Ups · 10×','Scapula Push-Ups · 10×','1 leichter Satz der ersten Übung'];
const E=(id,name,cat,sets,min,max,o={})=>({id,name,cat,sets,min,max,unit:o.unit||'reps',load:o.load||'',per:o.per||'',eq:o.eq||'',note:o.note||'',rest:o.rest||null});
const DEF={v:1,days:[
{id:'mo',name:'Lower A',type:'kraft',meta:'~60 min + 15 min Mobility',warm:WU_L,mob:'Mobility Lower · 15 min',blocks:[
 {label:'A',kind:'super',rest:75,ex:[E('pistol','Pistol Squats','quad',3,5,8,{load:'kg',per:'/Seite',eq:'Weight Vest',note:'Volle Tiefe, barfuß stabiler'}),E('nordic','Nordics','hk',3,4,6,{eq:'Sofa / Band',note:'Fersen fixieren, 3–5 s runter'})]},
 {label:'B',kind:'super',rest:75,ex:[E('rdl','Romanian Deadlift','hk',3,8,12,{load:'kg',eq:'Dumbbells',note:'Ersetzt Langhantel-Deadlift'}),E('revnordic','Reverse Nordics','quad',3,8,12,{eq:'Matte',note:'Hüfte gestreckt'})]},

      startT(ex.rest||d.blocks[t.dataset.b].rest)}
    arr[i]=x;save(key(r.d));render();
    if(x.ok){computePRs();const f=prOf(s,ex.id)[i];if(f){toast(f==='w'?'Neues Höchstgewicht':'Neuer Rekord',ex.name+' · '+prText(ex,x));try{navigator.vibrate&&navigator.vibrate([40,60,40,60,120])}catch(er){}}}
  }
  if(a==='back'){if(prevHash!==null)history.back();else location.hash='verlauf'}
  if(a==='metric'){exM[r.id]=t.dataset.m;render()}
  if(a==='exall'){allEx=!allEx;render()}
  if(a==='health'&&dateOf(r.d)===today()){
    const s=ensure(r.d),ts=Object.values(s.sets).flat().filter(x=>x&&x.ok&&x.t).map(x=>x.t),now=Date.now();
    const warm=d.warm&&d.warm.length?(d.type==='athletik'?10:d.warm.length>5?8:5):0;
    const start=new Date((ts.length?Math.min(...ts):now-3600000)-warm*60000);
    const mins=Math.max(5,Math.round((now-start)/60000));
    const p=n=>String(n).padStart(2,'0'),st=`${start.getFullYear()}-${p(start.getMonth()+1)}-${p(start.getDate())} ${p(start.getHours())}:${p(start.getMinutes())}`;
    const body=JSON.stringify({typ:HTYPE[d.type]||'Krafttraining',start:st,min:mins,name:d.name});
    s.health=`${mins} min · ${st.slice(11)} Uhr`;save();render();
    location.href=`shortcuts://run-shortcut?name=${encodeURIComponent(SC_NAME)}&input=text&text=${encodeURIComponent(body)}`;
  }
  if(a==='export'){exportBackup();t.textContent='Backup erstellt ✓'}
  if(a==='edit'){edit=!edit;render()}
  if(a==='scale'){const s=ensure(r.d);s.week=Object.assign({},s.week,{[t.dataset.k]:+t.dataset.n});save(key(r.d));render()}
  if(a==='exedit')openSheet(r.d,+t.dataset.b,+t.dataset.x);
  if(a==='add')openSheet(r.d,+t.dataset.b,-1);
  if(a==='reset'){if(t.dataset.sure){plan=clone(DEF);edit=false;save('plan');render()}else{t.dataset.sure='1';t.textContent='Sicher? Nochmal tippen zum Zurücksetzen'}}
});

/* edit sheet */
$('#fCat').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
function openSheet(dayId,bi,ei){
  const d=getDay(dayId),b=d.blocks[bi],ex=ei>=0?b.ex[ei]:E('x'+Date.now().toString(36),'','core',3,8,12);
  editing={dayId,bi,ei,id:ex.id};
  $('#fTitle').textContent=ei>=0?'Übung ändern':'Neue Übung in '+b.label;
  $('#fName').value=ex.name;$('#fCat').value=ex.cat;$('#fUnit').value=ex.unit;$('#fSets').value=ex.sets;$('#fLoad').value=ex.load;$('#fMin').value=ex.min;$('#fMax').value=ex.max;$('#fPer').value=ex.per;$('#fRest').value=ex.rest||'';$('#fEq').value=ex.eq;$('#fNote').value=ex.note;
  $('#fDel').style.display=ei>=0?'':'none';$('#sheet').classList.add('on');$('#fName').focus();
}
const closeSheet=()=>{$('#sheet').classList.remove('on');editing=null};
$('#fCancel').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#fDel').addEventListener('click',()=>{const{dayId,bi,ei}=editing;getDay(dayId).blocks[bi].ex.splice(ei,1);save('plan');closeSheet();render()});
$('#form').addEventListener('submit',e=>{
  e.preventDefault();const{dayId,bi,ei,id}=editing,b=getDay(dayId).blocks[bi];
  const n=v=>Math.max(0,parseInt(v,10)||0),mn=n($('#fMin').value),mx=Math.max(mn,n($('#fMax').value));
  const ex={id,name:$('#fName').value.trim()||'Übung',cat:$('#fCat').value,sets:Math.min(10,Math.max(1,n($('#fSets').value)||1)),min:mn,max:mx,unit:$('#fUnit').value,load:$('#fLoad').value,per:$('#fPer').value,eq:$('#fEq').value.trim(),note:$('#fNote').value.trim(),rest:n($('#fRest').value)||null};
  if(ei>=0)b.ex[ei]=ex;else b.ex.push(ex);save('plan');closeSheet();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing)closeSheet()});
addEventListener('hashchange',e=>{
  const o=new URL(e.oldURL).hash,n=location.hash;pos[o]=scrollY;prevHash=o;edit=false;render();
  scrollTo(0,o.startsWith('#x-')&&!n.startsWith('#x-')&&pos[n]!=null?pos[n]:0); /* back from a chart keeps your place */
});
addEventListener('resize',()=>{if(route().v==='ex'){clearTimeout(rzT);rzT=setTimeout(render,150)}});

/* storage */
render();
setStatus(Object.keys(sess).length?'Gespeichert auf diesem Gerät':'Bereit · Daten bleiben auf diesem Gerät');
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
